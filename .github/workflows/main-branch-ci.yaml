# Main Branch CI
name: Main Branch CI
on:
  push: 
    branches: 
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Push
        run: echo " Code pushed to main branch"
      - name: Print Secret Key
        env:
          MY_SECRET: ${{ secrets.MAIN_KEY }}
        run: echo "The secret is loaded. Value is $MY_SECRET"
    
  
